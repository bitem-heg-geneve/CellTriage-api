[project]
name = "celltriage-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery==5.6.3",
    "sqlalchemy==2.0.51",
    "watchfiles==1.2.0",
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "psycopg2-binary==2.9.12",
    "alembic==1.19.0",
    "atomicwrites==1.4.1",
    "attrs==26.1.0",
    "bcrypt==5.0.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "email-validator==2.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "passlib==1.7.4",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "gunicorn==26.0.0",
    "uvicorn==0.52.3",
    "jinja2==3.1.6",
    "kombu==5.6.2",
    "msgpack==1.2.1",
    "tenacity==9.1.2",
    "debugpy==1.8.14",
    "imbalanced-learn==0.14.2",
    "transformers==5.15.0",
    "nltk==3.10.2",
    "pandas==2.3.3",
    "redis==8.1.0",
    "orjson==3.11.9",
    "asgiref==3.12.1",
    "aiostream==0.7.1",
    "aiohttp==3.14.3",
    "tqdm==4.70.0",
    "pytorch-lightning==2.6.5",
    "torch==2.13.0+cpu",
]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    'pytest>=8.4.0',
    'httpx>=0.28.1',
]
