version: "3"
services:
  db:
    image: postgres:14
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - ./compose/.env.dev
    restart: always
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: ./compose/local/pytorch/Dockerfile
    depends_on:
      - db
    restart: always
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend/app:/app
      - ./backend/assets:/assets
      - ./model_resources:/model_resources
    env_file:
      - ./compose/.env.dev
    command: /app/run.sh
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.0.11-alpine
    container_name: reddis
    restart: always
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true

  flower:
    image: mher/flower
    container_name: flower
    command: celery flower
    env_file:
      - ./compose/.env.dev
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
      - db
    restart: always
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  worker-ingress:
    build:
      context: .
      dockerfile: ./compose/local/pytorch/Dockerfile
    image: worker_ingress
    command: celery -A app.main.celery worker --loglevel=info -Q ingress --hostname=ingress@%h --concurrency=4 --prefetch-multiplier=1
    volumes:
      - ./backend/app:/app
      - ./model_resources:/model_resources
    env_file:
      - ./compose/.env.dev
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      - redis
      - db
    restart: always
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    deploy:
      replicas: 1

  worker-infer:
    build:
      context: .
      dockerfile: ./compose/local/pytorch/Dockerfile
    image: worker_infer
    command: celery -A app.main.celery worker --loglevel=info -Q infer --hostname=infer@%h --pool=prefork --concurrency=1
    volumes:
      - ./backend/app:/app
      - ./model_resources:/model_resources
    env_file:
      - ./compose/.env.dev
    environment:
      LOAD_CT_TAGGER: yes
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      - redis
      - db
    restart: always
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    ulimits:
      stack: 67108864
      memlock: -1

volumes:
  app-db-data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
